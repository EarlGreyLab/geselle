<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geselle</title>
<meta name="description" content="Konzept-Demo: ein KI-Mitarbeiter für kleine Betriebe, der nach Lehrvertrag arbeitet, ein Berichtsheft führt und erst nach bestandener Prüfung mehr darf.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Idee: Lehrvertrag und Berichtsheft als Formulare. Kühles Papier, Stempelblau, DIN-artige Beschriftung. */
  --papier: #eef1f5;
  --blatt: #ffffff;
  --blatt-2: #f7f9fb;
  --tinte: #14213a;
  --tinte-2: #47546e;
  --tinte-3: #6b7890;
  --linie: #d3dae5;
  --linie-2: #e6eaf1;
  --stempel: #1f48c4;
  --stempel-weich: #e4eafb;
  --auf-stempel: #ffffff;
  --gut: #177245;
  --gut-weich: #e2f3ea;
  --warn: #a35a00;
  --warn-weich: #fbeeda;
  --krit: #b8301c;
  --krit-weich: #fae6e2;
  --serie-1: #2a78d6;
  --serie-2: #eb6834;
  --schatten: 0 1px 0 rgba(20, 33, 58, .04), 0 6px 18px -12px rgba(20, 33, 58, .25);
  --anzeige: "Barlow Condensed", "DIN Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --text: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papier: #0f141d; --blatt: #171d29; --blatt-2: #1c2331; --tinte: #e7ecf6; --tinte-2: #b0bace; --tinte-3: #8590a8;
    --linie: #2b3548; --linie-2: #222b3b; --stempel: #86a6ff; --stempel-weich: #1d2a4d; --auf-stempel: #0c1222;
    --gut: #5fce96; --gut-weich: #14301f; --warn: #f0b157; --warn-weich: #3a2a10; --krit: #ff8a75; --krit-weich: #3d1b15;
    --serie-1: #3987e5; --serie-2: #d95926; --schatten: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 22px -14px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papier: #0f141d; --blatt: #171d29; --blatt-2: #1c2331; --tinte: #e7ecf6; --tinte-2: #b0bace; --tinte-3: #8590a8;
  --linie: #2b3548; --linie-2: #222b3b; --stempel: #86a6ff; --stempel-weich: #1d2a4d; --auf-stempel: #0c1222;
  --gut: #5fce96; --gut-weich: #14301f; --warn: #f0b157; --warn-weich: #3a2a10; --krit: #ff8a75; --krit-weich: #3d1b15;
  --serie-1: #3987e5; --serie-2: #d95926; --schatten: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 22px -14px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--papier); color: var(--tinte); font: 400 15px/1.5 var(--text); }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--stempel); outline-offset: 2px; border-radius: 3px; }
a { color: var(--stempel); }
.nur-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.rahmen { max-width: 1240px; margin: 0 auto; padding: 0 20px; }

/* Kopf */
.kopf { background: var(--blatt); border-bottom: 1px solid var(--linie); }
.kopf-zeile { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 14px 0 12px; }
.marke { display: flex; align-items: baseline; gap: 12px; margin-right: auto; }
.marke b { font: 700 30px/1 var(--anzeige); letter-spacing: .06em; text-transform: uppercase; }
.marke b i { font-style: normal; color: var(--stempel); }
.marke span { font: 500 15px/1.2 var(--anzeige); letter-spacing: .08em; text-transform: uppercase; color: var(--tinte-3); }
.wahl { display: inline-flex; border: 1px solid var(--linie); border-radius: 6px; overflow: hidden; background: var(--blatt-2); }
.wahl button { border: 0; background: transparent; padding: 7px 13px; cursor: pointer; font: 600 15px/1.2 var(--anzeige); letter-spacing: .05em; text-transform: uppercase; color: var(--tinte-2); border-right: 1px solid var(--linie); }
.wahl button:last-child { border-right: 0; }
.wahl button[aria-pressed="true"] { background: var(--stempel); color: var(--auf-stempel); }
.wahl button:disabled { opacity: .45; cursor: not-allowed; }
.reiter { display: flex; gap: 2px; overflow-x: auto; margin: 0 -4px; padding: 0 4px; scrollbar-width: thin; }
.reiter a { flex: none; padding: 9px 13px 10px; text-decoration: none; color: var(--tinte-2); font: 600 16px/1.2 var(--anzeige); letter-spacing: .06em; text-transform: uppercase; border-bottom: 3px solid transparent; }
.reiter a:hover { color: var(--tinte); }
.reiter a[aria-current="page"] { color: var(--stempel); border-bottom-color: var(--stempel); }
.reiter a .zahl { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 5px; border-radius: 9px; background: var(--krit); color: var(--blatt); font: 600 12px/18px var(--text); text-align: center; letter-spacing: 0; }

main { padding: 22px 0 56px; }
.spalten { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 22px; align-items: start; }
@media (max-width: 940px) { .spalten { grid-template-columns: minmax(0, 1fr); } }

/* These */
.these { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px 32px; align-items: end; margin-bottom: 22px; }
@media (max-width: 860px) { .these { grid-template-columns: minmax(0, 1fr); } }
.these h1 { font: 700 clamp(30px, 4.4vw, 46px)/1.02 var(--anzeige); letter-spacing: .01em; text-transform: uppercase; }
.these h1 em { font-style: normal; color: var(--stempel); }
.these p { margin-top: 10px; max-width: 62ch; color: var(--tinte-2); }
.muster { display: inline-block; margin-top: 10px; padding: 2px 8px; border: 1px dashed var(--tinte-3); border-radius: 3px; font: 500 12px/1.5 var(--mono); color: var(--tinte-3); }
.kennzahlen { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--linie); border-radius: 8px; background: var(--blatt); box-shadow: var(--schatten); overflow: hidden; }
.kennzahlen div { padding: 11px 14px 12px; border-right: 1px solid var(--linie-2); border-bottom: 1px solid var(--linie-2); }
.kennzahlen div:nth-child(3n) { border-right: 0; }
.kennzahlen div:nth-last-child(-n+3) { border-bottom: 0; }
.kennzahlen dt { font: 600 13px/1.2 var(--anzeige); letter-spacing: .08em; text-transform: uppercase; color: var(--tinte-3); }
.kennzahlen dd { margin: 3px 0 0; font: 600 25px/1.1 var(--anzeige); font-variant-numeric: tabular-nums; }
.kennzahlen dd small { font: 500 13px/1 var(--text); color: var(--tinte-3); margin-left: 3px; }
.kennzahlen .achtung dd { color: var(--krit); }
dl { margin: 0; }

/* Blätter */
.blatt { min-width: 0; background: var(--blatt); border: 1px solid var(--linie); border-radius: 8px; box-shadow: var(--schatten); }
.blatt > header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; padding: 13px 16px 11px; border-bottom: 1px solid var(--linie-2); }
.blatt > header h2, .abschnitt-titel { font: 700 19px/1.15 var(--anzeige); letter-spacing: .07em; text-transform: uppercase; }
.blatt > header p { color: var(--tinte-3); font-size: 13px; }
.blatt .innen { padding: 14px 16px 16px; }
.stapel { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.hinweis { font-size: 13px; color: var(--tinte-3); }
.hinweis b { color: var(--tinte-2); font-weight: 600; }
.lauftext { max-width: 68ch; color: var(--tinte-2); }
.lauftext + .lauftext { margin-top: 8px; }

/* Knöpfe */
.knopf { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--linie); background: var(--blatt); cursor: pointer; font: 600 15px/1.2 var(--anzeige); letter-spacing: .06em; text-transform: uppercase; color: var(--tinte); }
.knopf:hover { border-color: var(--tinte-3); }
.knopf.haupt { background: var(--stempel); border-color: var(--stempel); color: var(--auf-stempel); }
.knopf.haupt:hover { filter: brightness(1.08); }
.knopf.nein { color: var(--krit); }
.knopf.klein { padding: 5px 10px; font-size: 14px; }
.knopf:disabled { opacity: .5; cursor: not-allowed; }
.knopfzeile { display: flex; flex-wrap: wrap; gap: 8px; }

/* Stempel */
.stempel { display: inline-block; padding: 2px 8px 1px; border: 1.5px solid currentColor; border-radius: 3px; font: 700 13px/1.35 var(--anzeige); letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
.stempel.selbst { color: var(--gut); background: var(--gut-weich); }
.stempel.offen { color: var(--warn); background: var(--warn-weich); }
.stempel.meister { color: var(--stempel); background: var(--stempel-weich); }
.stempel.abgewehrt, .stempel.abgelehnt { color: var(--krit); background: var(--krit-weich); }
.stempel.frei { color: var(--gut); background: transparent; transform: rotate(-2.5deg); }
.stempel.grau { color: var(--tinte-3); white-space: normal; }
@keyframes druck { 0% { transform: rotate(-2.5deg) scale(1.9); opacity: 0; } 60% { transform: rotate(-2.5deg) scale(.94); opacity: 1; } 100% { transform: rotate(-2.5deg) scale(1); } }
.stempel.neu { animation: druck .32s ease-out; }
@media (prefers-reduced-motion: reduce) { .stempel.neu { animation: none; } }

/* Eingang */
.eingang { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.vorgang { min-width: 0; background: var(--blatt); border: 1px solid var(--linie); border-left: 4px solid var(--linie); border-radius: 8px; box-shadow: var(--schatten); }
.vorgang.s-selbst { border-left-color: var(--gut); }
.vorgang.s-offen { border-left-color: var(--warn); }
.vorgang.s-meister { border-left-color: var(--stempel); }
.vorgang.s-abgewehrt, .vorgang.s-abgelehnt { border-left-color: var(--krit); }
.vorgang.s-frei, .vorgang.s-erledigt { border-left-color: var(--gut); }
.vorgang-kopf { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 11px 14px 0; }
.vorgang-kopf time { font: 500 13px/1 var(--mono); color: var(--tinte-2); }
.kanal { font: 600 13px/1.2 var(--anzeige); letter-spacing: .08em; text-transform: uppercase; color: var(--tinte-3); }
.vorgang-kopf .rechts { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.nachricht { margin: 8px 14px 0; padding: 8px 12px; background: var(--blatt-2); border-radius: 6px; border: 1px solid var(--linie-2); overflow-wrap: anywhere; }
.nachricht .sterne { color: var(--warn); letter-spacing: 2px; margin-right: 6px; }
.ergebnis { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 9px 14px 11px; }
.ergebnis strong { font-weight: 600; }
.ergebnis .meta { font: 400 12px/1.4 var(--mono); color: var(--tinte-3); margin-left: auto; }
.vorgang details { border-top: 1px solid var(--linie-2); }
.vorgang summary { padding: 8px 14px; cursor: pointer; color: var(--tinte-2); font-size: 13px; }
.vorgang summary:hover { color: var(--tinte); }
.schritte { list-style: none; margin: 0; padding: 0 14px 4px; display: grid; gap: 4px; }
.schritte li { display: grid; grid-template-columns: 112px 16px minmax(0, 1fr); gap: 6px; font-size: 13.5px; align-items: baseline; }
.schritte .was { font: 600 13px/1.4 var(--anzeige); letter-spacing: .07em; text-transform: uppercase; color: var(--tinte-3); }
.schritte .ok { color: var(--gut); font-weight: 700; }
.schritte .nok { color: var(--krit); font-weight: 700; }
.entwurf { margin: 8px 14px 12px; }
.entwurf label { display: block; font: 600 13px/1.4 var(--anzeige); letter-spacing: .07em; text-transform: uppercase; color: var(--tinte-3); margin-bottom: 4px; }
.entwurf textarea, .entwurf pre { display: block; width: 100%; margin: 0; padding: 9px 11px; border: 1px solid var(--linie); border-radius: 6px; background: var(--blatt-2); font: 400 13.5px/1.5 var(--text); white-space: pre-wrap; overflow-wrap: anywhere; resize: vertical; }
.entwurf textarea { min-height: 110px; background: var(--blatt); }
.aktionen { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 14px 12px; align-items: center; }
.aktionen .hinweis { flex: 1 1 200px; }
.warnkasten { margin: 0 14px 12px; padding: 8px 11px; border-radius: 6px; background: var(--krit-weich); color: var(--krit); font-size: 13.5px; }

/* Seitenleiste */
.seite { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; position: sticky; top: 12px; }
@media (max-width: 940px) { .seite { position: static; } }
.uhr { display: flex; align-items: baseline; gap: 10px; }
.uhr b { font: 600 34px/1 var(--anzeige); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.uhr span { color: var(--tinte-3); font-size: 13px; }
.fortschritt { height: 4px; background: var(--linie-2); border-radius: 2px; margin: 10px 0 12px; overflow: hidden; }
.fortschritt i { display: block; height: 100%; background: var(--stempel); }
.feld { display: grid; gap: 4px; }
.feld label, .feldname { font: 600 13px/1.3 var(--anzeige); letter-spacing: .07em; text-transform: uppercase; color: var(--tinte-3); }
.feld textarea, .feld select, .feld input[type="number"], .feld input[type="text"] { width: 100%; padding: 8px 10px; border: 1px solid var(--linie); border-radius: 6px; background: var(--blatt); }
.feld textarea { min-height: 84px; resize: vertical; }
.beispiele { display: flex; flex-wrap: wrap; gap: 6px; }
.beispiele button { border: 1px solid var(--linie); background: var(--blatt-2); border-radius: 14px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; color: var(--tinte-2); text-align: left; }
.beispiele button:hover { border-color: var(--stempel); color: var(--stempel); }
.bericht { margin: 0; padding: 10px 12px; background: var(--blatt-2); border: 1px solid var(--linie-2); border-radius: 6px; font: 400 13px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.schalter { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; }
.schalter input { margin-top: 3px; }

/* Tabellen */
.rollbar { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--linie-2); vertical-align: top; }
thead th { font: 600 13px/1.3 var(--anzeige); letter-spacing: .08em; text-transform: uppercase; color: var(--tinte-3); border-bottom: 1px solid var(--linie); white-space: nowrap; background: var(--blatt); }
td.z, th.z { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tfoot td { border-top: 1px solid var(--linie); border-bottom: 0; font-weight: 600; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.heft td { font-size: 13.5px; }
.heft tr.kaputt td { background: var(--krit-weich); }
.heft tr.folge td { opacity: .55; }

/* Lehrvertrag */
.vertrag-kopf { padding: 18px 20px 14px; border-bottom: 2px solid var(--tinte); display: grid; gap: 4px; }
.vertrag-kopf h2 { font: 700 30px/1 var(--anzeige); letter-spacing: .12em; text-transform: uppercase; }
.vertrag-kopf p { color: var(--tinte-2); }
.para { padding: 16px 20px; border-bottom: 1px solid var(--linie-2); }
.para:last-child { border-bottom: 0; }
.para h3 { font: 700 18px/1.2 var(--anzeige); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }
.para h3 span { color: var(--stempel); margin-right: 8px; }
.faehigkeit { display: grid; grid-template-columns: minmax(0, 1.1fr) auto minmax(0, 1fr); gap: 10px 18px; padding: 13px 0; border-bottom: 1px solid var(--linie-2); align-items: start; }
.faehigkeit:last-child { border-bottom: 0; padding-bottom: 0; }
@media (max-width: 860px) { .faehigkeit { grid-template-columns: minmax(0, 1fr); } }
.faehigkeit h4 { font: 600 15.5px/1.3 var(--text); }
.faehigkeit .text { color: var(--tinte-2); font-size: 13.5px; margin-top: 2px; }
.grenze { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13.5px; color: var(--tinte-2); }
.grenze input { width: 78px; padding: 5px 8px; border: 1px solid var(--linie); border-radius: 6px; background: var(--blatt); text-align: right; font-variant-numeric: tabular-nums; }
.sperre { font-size: 12.5px; color: var(--warn); margin-top: 5px; }
.fest { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.fest li { padding: 4px 10px; border: 1.5px solid var(--tinte); border-radius: 3px; font: 600 14px/1.4 var(--anzeige); letter-spacing: .06em; text-transform: uppercase; }
.wege { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin-top: 10px; }
.weg { border: 1px solid var(--linie); border-radius: 6px; padding: 10px 12px; display: grid; gap: 6px; }
.weg b { font-weight: 600; }
.weg .wahl, .weg .stempel, .feld .wahl { justify-self: start; }
.weg small { color: var(--tinte-3); }
pre.code { margin: 10px 0 0; padding: 12px 14px; border-radius: 6px; background: var(--blatt-2); border: 1px solid var(--linie-2); font: 400 12.5px/1.55 var(--mono); overflow-x: auto; max-height: 340px; }

/* Prüfung */
.zeugnis { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.note { border: 1px solid var(--linie); border-radius: 6px; padding: 10px 12px 11px; background: var(--blatt); display: grid; gap: 5px; }
.note h4 { font: 600 14px/1.3 var(--text); }
.note .bruch { font: 600 24px/1 var(--anzeige); font-variant-numeric: tabular-nums; }
.note .balken { height: 5px; background: var(--linie-2); border-radius: 3px; overflow: hidden; }
.note .balken i { display: block; height: 100%; background: var(--gut); }
.note.teil .balken i { background: var(--warn); }
.fall-ok { color: var(--gut); font-weight: 700; }
.fall-nok { color: var(--krit); font-weight: 700; }
.klein { font-size: 12.5px; color: var(--tinte-3); }

/* Backzettel */
.regler { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px 22px; align-items: end; }
.regler output { font: 600 15px/1 var(--mono); }
.regler input[type="range"] { width: 100%; accent-color: var(--stempel); }
.strich { position: relative; height: 12px; min-width: 120px; background: var(--linie-2); border-radius: 0 4px 4px 0; }
.strich i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--serie-1); border-radius: 0 4px 4px 0; }
.strich u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--tinte); }
.vergleich { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.vergleich > div { border: 1px solid var(--linie); border-radius: 6px; padding: 10px 12px; }
.vergleich dt { font: 600 13px/1.3 var(--anzeige); letter-spacing: .07em; text-transform: uppercase; color: var(--tinte-3); }
.vergleich dd { margin: 4px 0 0; display: flex; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; }
.vergleich dd b { font: 600 24px/1 var(--anzeige); }
.vergleich dd s { color: var(--tinte-3); text-decoration: none; font-size: 13px; }
.grafik { position: relative; }
.grafik svg { display: block; width: 100%; height: auto; }
.grafik text { font: 400 11px var(--text); fill: var(--tinte-3); }
.grafik .ende { font-weight: 600; fill: var(--tinte); }
.legende { display: flex; gap: 16px; font-size: 13px; color: var(--tinte-2); flex-wrap: wrap; }
.legende i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.tipp { position: absolute; pointer-events: none; padding: 6px 9px; background: var(--tinte); color: var(--blatt); border-radius: 5px; font-size: 12.5px; line-height: 1.4; white-space: nowrap; transform: translate(-50%, -110%); z-index: 2; }

/* Wirkung */
.rechner { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px 28px; }
@media (max-width: 780px) { .rechner { grid-template-columns: minmax(0, 1fr); } }
.eingaben { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; align-content: start; }
.eingabe { display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 10px; align-items: center; }
.eingabe label { font-size: 13.5px; color: var(--tinte-2); }
.eingabe input { width: 100%; padding: 6px 8px; border: 1px solid var(--linie); border-radius: 6px; background: var(--blatt); text-align: right; font-variant-numeric: tabular-nums; }
.ausgabe { min-width: 0; grid-template-columns: minmax(0, 1fr); background: var(--blatt-2); border: 1px solid var(--linie-2); border-radius: 8px; padding: 14px 16px; display: grid; gap: 10px; align-content: start; }
.ausgabe .gross { font: 700 40px/1 var(--anzeige); font-variant-numeric: tabular-nums; }
.ausgabe .zeile { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; border-top: 1px solid var(--linie-2); padding-top: 8px; font-variant-numeric: tabular-nums; }
.ausgabe .zeile span { color: var(--tinte-2); }
.formel { font: 400 12px/1.5 var(--mono); color: var(--tinte-3); }

/* Bauplan */
.zwei { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.liste { margin: 8px 0 0; padding-left: 18px; color: var(--tinte-2); display: grid; gap: 5px; }
.liste b { color: var(--tinte); font-weight: 600; }
.bau svg { display: block; width: 100%; height: auto; min-width: 640px; }
.bau .k { fill: var(--blatt-2); stroke: var(--linie); }
.bau .k2 { fill: var(--stempel-weich); stroke: var(--stempel); }
.bau text { font: 500 12.5px var(--text); fill: var(--tinte); }
.bau .t2 { fill: var(--tinte-3); font-size: 11px; font-weight: 400; }
.bau .ue { font: 700 13px var(--anzeige); letter-spacing: .08em; text-transform: uppercase; }
.bau .pf { stroke: var(--tinte-3); stroke-width: 1.5; fill: none; }

.fuss { border-top: 1px solid var(--linie); padding: 18px 0 30px; color: var(--tinte-3); font-size: 12.5px; }
.fuss p { max-width: 90ch; }

@media (max-width: 520px) { .schritte li { grid-template-columns: 16px minmax(0, 1fr); } .schritte .was { grid-column: 1 / -1; margin-top: 4px; } .kennzahlen dd { font-size: 22px; } .kennzahlen dt { font-size: 12px; } .rahmen { padding: 0 16px; } }

  /* ---------- Backzettel ---------- */
  function linienGrafik(tage) {
    var W = 640, H = 210, l = 38, r = 96, t = 12, bo = 28, n = tage.length;
    var max = 0; tage.forEach(function (d) { max = Math.max(max, d.bisher, d.geselle); });
    var top = Math.ceil(max * 100 / 5) * 5 / 100; if (top < 0.1) top = 0.1;
    function x(i) { return l + (W - l - r) * i / (n - 1); }
    function y(v) { return t + (H - t - bo) * (1 - v / top); }
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Retourenquote je Tag im Rücktest, bisherige Methode gegen Geselle">';
    for (var g = 0; g <= top * 100 + 0.01; g += 5) s += '<line x1="' + l + '" x2="' + (W - r) + '" y1="' + y(g / 100) + '" y2="' + y(g / 100) + '" stroke="var(--linie-2)" stroke-width="1"/><text x="' + (l - 6) + '" y="' + (y(g / 100) + 4) + '" text-anchor="end">' + g + ' %</text>';
    [['bisher', 'var(--serie-2)', 'Bisher'], ['geselle', 'var(--serie-1)', 'Geselle']].forEach(function (ser) {
      var d = tage.map(function (p, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p[ser[0]]).toFixed(1); }).join(' ');
      var letzter = tage[n - 1][ser[0]];
      s += '<path d="' + d + '" fill="none" stroke="' + ser[1] + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="' + x(n - 1) + '" cy="' + y(letzter) + '" r="4" fill="' + ser[1] + '" stroke="var(--blatt)" stroke-width="2"/>';
    });
    var ya = y(tage[n - 1].bisher), yb = y(tage[n - 1].geselle);
    if (Math.abs(ya - yb) < 13) { if (ya < yb) { ya -= (13 - (yb - ya)) / 2; yb += (13 - (yb - ya)) / 2; } else { yb -= (13 - (ya - yb)) / 2; ya += (13 - (ya - yb)) / 2; } }
    s += '<text class="ende" x="' + (x(n - 1) + 9) + '" y="' + (ya + 4) + '">Bisher ' + E.zahl(tage[n - 1].bisher * 100, 1) + ' %</text><text class="ende" x="' + (x(n - 1) + 9) + '" y="' + (yb + 4) + '">Geselle ' + E.zahl(tage[n - 1].geselle * 100, 1) + ' %</text>';
    tage.forEach(function (p, i) {
      if (i % 3 === 0 || i === n - 1) s += '<text x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + E.datumLabel(p.tag).replace(/\.$/, '') + '</text>';
      var bw = (W - l - r) / (n - 1);
      s += '<rect x="' + (x(i) - bw / 2) + '" y="' + t + '" width="' + bw + '" height="' + (H - t - bo) + '" fill="transparent" data-tipp="' + esc(E.datumLabel(p.tag) + '|Bisher ' + E.zahl(p.bisher * 100, 1) + ' %|Geselle ' + E.zahl(p.geselle * 100, 1) + ' %') + '" data-x="' + (x(i) / W * 100).toFixed(2) + '"/>';
    });
    return s + '</svg>';
  }

  /* ---------- Verstehen mit Claude (nur wenn die Seite es darf) ---------- */

  document.addEventListener('click', function (ev) {
